        - paragraph [ref=f3e148]: "தகுதிகள்: பி.எஸ் .சி, மாஸ்டர் டிப்ளோமா (ஏ.சி.யூ), மாஸ்டர் டிப்ளோமா இன் கிளாசிக்கல் (ஏ.சி.யூ), டாக்டர் ஆஃப் மெடிசின் இன் (ஏ.சி.யூ), கொழும்பு பல்கலைக்கழகம், இலங்கை. பொதுச் செயலாளர், CASMA (கிளாசிக்கல் அக்குபஞ்சர் சயின்ஸ் மெடிக்கல் அசோசியேஷன்)."
