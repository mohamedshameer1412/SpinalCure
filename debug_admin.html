<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SpinalCure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>

<body
    style="min-height:100vh;background:linear-gradient(135deg,#15803d 0%,#166534 50%,#14532d 100%);display:flex;align-items:center;justify-content:center;padding:16px">

    <!-- Background blobs -->
    <div style="position:fixed;inset:0;overflow:hidden;pointer-events:none">
        <div
            style="position:absolute;top:80px;left:80px;width:300px;height:300px;background:rgba(255,255,255,0.05);border-radius:50%;filter:blur(60px)">
        </div>
        <div
            style="position:absolute;bottom:80px;right:80px;width:400px;height:400px;background:rgba(255,255,255,0.05);border-radius:50%;filter:blur(60px)">
        </div>
    </div>

    <div style="position:relative;width:100%;max-width:420px">
        <!-- Logo -->
        <div style="text-align:center;margin-bottom:28px">
            <div class="float"
                style="width:72px;height:72px;background:white;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <span style="font-size:32px;font-weight:900;color:#15803d">S</span>
            </div>
            <h1 style="font-size:28px;font-weight:800;color:white;margin:0">SpinalCure</h1>
            <p style="color:rgba(187,247,208,0.9);font-size:13px;margin-top:4px">Acupuncture Clinic Management</p>
        </div>

        <!-- Card -->
        <div style="background:white;border-radius:24px;box-shadow:0 25px 80px rgba(0,0,0,0.25);padding:36px">
            <h2 style="font-size:20px;font-weight:700;color:#111827;margin:0 0 4px">Welcome back</h2>
            <p style="font-size:13px;color:#6b7280;margin:0 0 24px">Sign in with your email address</p>

            

            <form method="POST" action="/en/accounts/login/" style="display:flex;flex-direction:column;gap:16px">
                <input type="hidden" name="csrfmiddlewaretoken" value="yhMZ3VUtqZYBT2X1ZHkeNReC4Ffg4dcobAqfpHO5csOdJPe3awD1I4oH3XIqrzxT">

                <div>
                    <label for="username"
                        style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px">Email
                        Address</label>
                    <div style="position:relative">
                        <div style="position:absolute;top:50%;left:14px;transform:translateY(-50%);pointer-events:none">
                            <svg style="width:18px;height:18px;color:#9ca3af" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <input type="email" name="username" id="username" required autocomplete="email"
                            style="width:100%;padding:12px 16px 12px 44px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:14px;color:#111827;outline:none;box-sizing:border-box"
                            placeholder="doctor@spinalcure.com"
                            onfocus="this.style.borderColor='#16a34a';this.style.background='white'"
                            onblur="this.style.borderColor='#e5e7eb';this.style.background='#f9fafb'">
                    </div>
                </div>

                <div>
                    <label for="password"
                        style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px">Password</label>
                    <div style="position:relative">
                        <div style="position:absolute;top:50%;left:14px;transform:translateY(-50%);pointer-events:none">
                            <svg style="width:18px;height:18px;color:#9ca3af" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" name="password" id="password" required autocomplete="current-password"
                            style="width:100%;padding:12px 16px 12px 44px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;font-size:14px;color:#111827;outline:none;box-sizing:border-box"
                            placeholder="••••••••"
                            onfocus="this.style.borderColor='#16a34a';this.style.background='white'"
                            onblur="this.style.borderColor='#e5e7eb';this.style.background='#f9fafb'">
                    </div>
                </div>

                <button type="submit"
                    style="width:100%;padding:14px;background:linear-gradient(to right,#16a34a,#15803d);color:white;font-size:14px;font-weight:700;border:none;border-radius:12px;cursor:pointer;box-shadow:0 4px 15px rgba(22,163,74,0.3);transition:opacity 0.2s"
                    onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                    Sign in to Dashboard
                </button>
            </form>

            <div style="margin-top:24px;padding-top:16px;border-top:1px solid #f3f4f6;text-align:center">
                <p style="font-size:11px;color:#9ca3af">© 2024 SpinalCure — Secure Clinic Management</p>
            </div>
        </div>
    </div>
</body>

</html>
