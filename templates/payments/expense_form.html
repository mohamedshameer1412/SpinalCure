{% extends "base.html" %}

{% load i18n %}
{% block title %}{% trans "Add Expense — SpinalCure" %}{% endblock %}
{% block page_title %}{% trans "Record Expense" %}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8">
        <h2 class="text-lg font-semibold text-gray-800 mb-6">{% trans "Expense Details" %}</h2>
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div class="sm:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">{% trans "Title / Description" %} <span
                            class="text-red-500">*</span></label>
                    <input type="text" name="title" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                        placeholder="{% trans 'e.g., Monthly Clinic Rent' %}">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">{% trans "Category" %} <span
                            class="text-red-500">*</span></label>
                    <select name="category" data-placeholder="{% trans 'Select Category' %}"
                        class="premium-select w-full px-4 py-3 bg-gray-100 border-2 border-transparent focus:border-primary-500 focus:bg-white rounded-xl text-sm transition-all outline-none">
                        <option value="">{% trans "Select Category" %}</option>
                        {% for value, label in categories %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">{% trans "Amount (₹)" %} <span
                            class="text-red-500">*</span></label>
                    <input type="number" name="amount" step="0.01" min="0" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                        placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">{% trans "Date" %} <span
                            class="text-red-500">*</span></label>
                    <input type="date" name="expense_date" required
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">{% trans "Paid To" %}</label>
                    <input type="text" name="paid_to"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                        placeholder="{% trans 'Vendor / Person name' %}">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">{% trans "Notes" %}</label>
                    <textarea name="notes" rows="3"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 resize-none"
                        placeholder="{% trans 'Additional details (optional)' %}"></textarea>
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit"
                    class="px-6 py-3 bg-primary-600 text-white font-semibold text-sm rounded-xl hover:bg-primary-700 transition-all">
                    {% trans "Save Expense" %}
                </button>
                <a href="{% url 'expense_list' %}"
                    class="px-6 py-3 bg-gray-100 text-gray-700 font-semibold text-sm rounded-xl hover:bg-gray-200 transition-all">
                    {% trans "Cancel" %}
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
