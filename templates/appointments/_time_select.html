{% comment %}A time dropdown (quarter-hour steps). Params: name, value, aria, options.{% endcomment %}
<select name="{{ name }}" aria-label="{{ aria }}" data-keep-order data-placeholder="—" class="w-full">
    <option value="">—</option>
    {% for v, l in options %}<option value="{{ v }}"{% if v == value %} selected{% endif %}>{{ l }}</option>{% endfor %}
</select>
