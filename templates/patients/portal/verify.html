<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP — SpinalCure</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-primary-400 to-primary-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg mb-4 text-white text-2xl font-bold">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Verify It's You</h1>
                <p class="text-sm text-gray-500 mt-2">We've sent a 6-digit code to <strong class="text-gray-900">{{ phone }}</strong></p>
                <div class="mt-2 text-xs text-orange-600 bg-orange-50 inline-block px-3 py-1 rounded-full font-bold">
                    [DEMO MODE] Code is "123456"
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="mb-6 p-4 rounded-xl text-sm font-semibold flex items-center gap-2
                    {% if message.tags == 'success' %}bg-green-50 text-green-700
                    {% else %}bg-red-50 text-red-700{% endif %}">
                    <i class="bi {% if message.tags == 'success' %}bi-check-circle{% else %}bi-exclamation-circle{% endif %}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 text-center">Enter 6-digit Code</label>
                    <input type="text" name="otp" required maxlength="6" autocomplete="one-time-code" pattern="\d{6}"
                        class="w-full text-center text-3xl tracking-[0.5em] font-black py-4 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none">
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-xl shadow-lg shadow-primary-600/30 transition-all active:scale-[0.98]">
                    Verify & Login
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="{% url 'portal_login' %}" class="text-sm font-semibold text-gray-500 hover:text-primary-600 transition-colors">
                    Change Phone Number
                </a>
            </div>
        </div>
    </div>

</body>
</html>
