{% load i18n %}
<div class="relative" x-data="{ exportOpen: false }" @keydown.escape.window="exportOpen = false">
    <button @click="exportOpen = !exportOpen" @click.outside="exportOpen = false" type="button" class="btn btn-outline" aria-haspopup="menu" :aria-expanded="exportOpen">
        <i class="bi bi-box-arrow-up" aria-hidden="true"></i>{% trans "Export" %}<i class="bi bi-chevron-down text-[10px] opacity-60" aria-hidden="true"></i>
    </button>
    <div x-show="exportOpen" x-cloak class="menu absolute end-0 top-full mt-2 w-56" role="menu">
        <p class="menu-label">{% trans "Available formats" %}</p>
        <a href="{{ excel_url }}" class="menu-item" role="menuitem"><i class="bi bi-file-earmark-excel text-green-600"></i>{% trans "Excel Spreadsheet" %}</a>
        <a href="{{ csv_url }}" class="menu-item" role="menuitem"><i class="bi bi-file-earmark-spreadsheet text-blue-600"></i>{% trans "CSV Document" %}</a>
        <a href="{{ pdf_url }}" class="menu-item" role="menuitem"><i class="bi bi-file-earmark-pdf text-red-600"></i>{% trans "PDF Report" %}</a>
        <div class="menu-separator"></div>
        <button type="button" onclick="handleExportAction('print', '{{ print_url }}')" class="menu-item" role="menuitem"><i class="bi bi-printer text-gray-500"></i>{% trans "Print Records" %}</button>
        <button type="button" onclick="handleExportAction('copy', '{{ copy_url }}')" class="menu-item" role="menuitem"><i class="bi bi-clipboard text-amber-600"></i>{% trans "Copy to Clipboard" %}</button>
    </div>
</div>

<script>
    /**
     * Standardized handler for Print and Copy actions across the system.
     */
    function handleExportAction(type, url) {
        if (type === 'copy') {
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split animate-spin text-amber-600"></i> <span>Copying...</span>';

            fetch(url)
                .then(r => r.text())
                .then(data => {
                    navigator.clipboard.writeText(data).then(() => {
                        btn.innerHTML = '<i class="bi bi-check2 text-green-600"></i> <span class="text-green-600">Copied!</span>';
                        setTimeout(() => {
                            btn.innerHTML = originalText;
                            btn.disabled = false;
                        }, 2000);
                    });
                })
                .catch(err => {
                    console.error('Copy failed:', err);
                    window.Alpine ? Alpine.store('toast').push('Failed to copy data.', 'error') : alert('Failed to copy data.');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                });
        } else if (type === 'print') {
            // Open a new window for printing to avoid messing up the current view
            const printWindow = window.open(url, '_blank');
            printWindow.onload = function () {
                setTimeout(() => {
                    printWindow.print();
                }, 500);
            };
        }
    }
</script>
