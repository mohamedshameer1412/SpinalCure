{% load i18n %}
<div id="global-confirm-modal" class="fixed inset-0 z-[9999] hidden flex items-center justify-center bg-gray-900/50 backdrop-blur-sm opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl transform scale-95 transition-transform duration-300 relative border border-gray-100" id="global-confirm-card">
        
        <div class="absolute top-0 right-0 p-4">
            <button id="global-confirm-close" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="flex items-center justify-center w-16 h-16 bg-red-50 text-red-500 rounded-2xl mb-6 mx-auto shadow-inner border border-red-100">
            <i class="bi bi-exclamation-triangle-fill text-3xl"></i>
        </div>
        
        <h3 class="text-center text-xl font-black text-gray-900 mb-3">{% trans "Are you sure?" %}</h3>
        <p class="text-center text-sm text-gray-500 font-medium mb-8 leading-relaxed" id="global-confirm-message">{% trans "You are about to delete this item." %}</p>
        
        <div class="flex gap-3">
            <button id="global-confirm-cancel" class="flex-1 py-3 bg-gray-50 hover:bg-gray-100 text-gray-600 text-sm font-bold rounded-xl transition-all border border-gray-200">{% trans "Cancel" %}</button>
            <button id="global-confirm-ok" class="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white text-sm font-bold rounded-xl transition-all shadow-md shadow-red-200 focus:ring-4 focus:ring-red-100">{% trans "Confirm" %}</button>
        </div>
    </div>
</div>

<script>
let globalConfirmCallback = null;

window.showCustomConfirm = function(message, onConfirmCallback) {
    const modal = document.getElementById('global-confirm-modal');
    const card = document.getElementById('global-confirm-card');
    
    document.getElementById('global-confirm-message').innerText = message;
    
    globalConfirmCallback = onConfirmCallback;
    
    modal.classList.remove('hidden');
    // slight delay for transition
    setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95');
    }, 10);
};

function closeCustomConfirm() {
    const modal = document.getElementById('global-confirm-modal');
    const card = document.getElementById('global-confirm-card');
    
    modal.classList.add('opacity-0');
    card.classList.add('scale-95');
    
    setTimeout(() => {
        modal.classList.add('hidden');
        globalConfirmCallback = null;
    }, 300);
}

document.addEventListener('DOMContentLoaded', function() {
    const btnOk = document.getElementById('global-confirm-ok');
    const btnCancel = document.getElementById('global-confirm-cancel');
    const btnClose = document.getElementById('global-confirm-close');

    const handleCancel = () => closeCustomConfirm();
    
    const handleOk = () => {
        if (globalConfirmCallback) {
            globalConfirmCallback();
        }
        closeCustomConfirm();
    };

    btnCancel.addEventListener('click', handleCancel);
    btnClose.addEventListener('click', handleCancel);
    btnOk.addEventListener('click', handleOk);

    // Global interceptor for data-confirm on form submission
    document.addEventListener('submit', function(e) {
        if (e.target.hasAttribute('data-confirm')) {
            e.preventDefault();
            const msg = e.target.getAttribute('data-confirm');
            
            window.showCustomConfirm(msg, () => {
                e.target.removeAttribute('data-confirm'); 
                e.target.submit();
            });
        }
    });
});
</script>
