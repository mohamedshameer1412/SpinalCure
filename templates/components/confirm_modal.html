{% load i18n %}
<div id="global-confirm-modal" class="dialog-overlay !z-[9999] hidden opacity-0 transition-opacity duration-200" role="alertdialog" aria-modal="true" aria-labelledby="global-confirm-title" aria-describedby="global-confirm-message">
    <div class="dialog !max-w-md scale-95 transition-transform duration-200" id="global-confirm-card">
        <div class="flex items-start gap-4">
            <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-600"><i class="bi bi-exclamation-triangle-fill text-xl" aria-hidden="true"></i></span>
            <div class="min-w-0 flex-1">
                <h3 class="dialog-title" id="global-confirm-title">{% trans "Are you sure?" %}</h3>
                <p class="dialog-description" id="global-confirm-message">{% trans "You are about to delete this item." %}</p>
            </div>
            <button id="global-confirm-close" type="button" class="text-gray-400 hover:text-gray-700" aria-label="{% trans 'Close' %}"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="dialog-footer">
            <button id="global-confirm-cancel" type="button" class="btn btn-outline">{% trans "Cancel" %}</button>
            <button id="global-confirm-ok" type="button" class="btn btn-destructive">{% trans "Confirm" %}</button>
        </div>
    </div>
</div>

<script>
let globalConfirmCallback = null;

window.showCustomConfirm = function(message, onConfirmCallback) {
    const modal = document.getElementById('global-confirm-modal');
    const card = document.getElementById('global-confirm-card');
    
    document.getElementById('global-confirm-message').innerText = message;
    
    globalConfirmCallback = onConfirmCallback;
    
    modal.classList.remove('hidden');
    // slight delay for transition
    setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95');
    }, 10);
};

function closeCustomConfirm() {
    const modal = document.getElementById('global-confirm-modal');
    const card = document.getElementById('global-confirm-card');
    
    modal.classList.add('opacity-0');
    card.classList.add('scale-95');
    
    setTimeout(() => {
        modal.classList.add('hidden');
        globalConfirmCallback = null;
    }, 200);
}

document.addEventListener('DOMContentLoaded', function() {
    const btnOk = document.getElementById('global-confirm-ok');
    const btnCancel = document.getElementById('global-confirm-cancel');
    const btnClose = document.getElementById('global-confirm-close');

    const handleCancel = () => closeCustomConfirm();
    
    const handleOk = () => {
        if (globalConfirmCallback) {
            globalConfirmCallback();
        }
        closeCustomConfirm();
    };

    btnCancel.addEventListener('click', handleCancel);
    btnClose.addEventListener('click', handleCancel);
    btnOk.addEventListener('click', handleOk);

    // Global interceptor for data-confirm on form submission
    document.addEventListener('submit', function(e) {
        if (e.target.hasAttribute('data-confirm')) {
            e.preventDefault();
            const msg = e.target.getAttribute('data-confirm');
            
            window.showCustomConfirm(msg, () => {
                e.target.removeAttribute('data-confirm'); 
                e.target.submit();
            });
        }
    });
});
</script>
