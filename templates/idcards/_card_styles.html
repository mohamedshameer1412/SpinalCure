{% load static %}
<style>
    @font-face { font-family: 'Noto Sans Tamil'; src: url('{% static "fonts/NotoSansTamil-Regular.ttf" %}') format('truetype'); font-weight: 400; }
    @font-face { font-family: 'Noto Sans Tamil'; src: url('{% static "fonts/NotoSansTamil-Bold.ttf" %}') format('truetype'); font-weight: 700; }
    @font-face { font-family: 'Noto Sans Devanagari'; src: url('{% static "fonts/NotoSansDevanagari-Regular.ttf" %}') format('truetype'); }
    @font-face { font-family: 'Noto Naskh Arabic'; src: url('{% static "fonts/NotoNaskhArabic-Regular.ttf" %}') format('truetype'); }
    :root { --idc-brand: #15803d; --idc-brand-dark: #14532d; --idc-ink: #0f172a; --idc-muted: #64748b; }
    .idc-stage-wrap { width: 100%; max-width: 900px; margin: 0 auto; }
    .idc-stage { width: 900px; height: 560px; transform-origin: top left; perspective: 1600px; }
    .idc-card { position: relative; width: 900px; height: 560px; transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border-radius: 28px; outline: none; }
    .idc-card.is-flipped { transform: rotateY(180deg); }
    .idc-card:focus-visible { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--idc-brand); }
    @media (prefers-reduced-motion: reduce) { .idc-card { transition: none; } }
    .idc-card .idc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .idc-card .idc-back { transform: rotateY(180deg); }
    .idc-face { width: 900px; height: 560px; box-sizing: border-box; border-radius: 28px; overflow: hidden; background: #fff;
        font-family: Inter, 'Noto Sans Tamil', 'Noto Sans Devanagari', 'Noto Naskh Arabic', system-ui, sans-serif; color: var(--idc-ink);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18); border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .idc-band { display: flex; align-items: center; justify-content: space-between; padding: 26px 36px; background: linear-gradient(120deg, var(--idc-brand-dark), var(--idc-brand)); color: #fff; }
    .idc-org { display: flex; align-items: center; gap: 16px; }
    .idc-logo { width: 64px; height: 64px; border-radius: 16px; background: #fff; object-fit: contain; padding: 6px; box-sizing: border-box; }
    .idc-logo-fallback { display: flex; align-items: center; justify-content: center; color: var(--idc-brand-dark); font-weight: 800; font-size: 30px; }
    .idc-org-name { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
    .idc-org-sub { font-size: 15px; opacity: 0.85; margin-top: 2px; }
    .idc-type { font-size: 14px; font-weight: 800; letter-spacing: 0.18em; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.4); }
    .idc-body { flex: 1; display: grid; grid-template-columns: 190px 1fr 170px; gap: 30px; padding: 34px 36px; align-items: center; }
    .idc-photo { width: 190px; height: 230px; border-radius: 20px; overflow: hidden; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 800; color: #94a3b8; border: 4px solid #f0fdf4; }
    .idc-photo img { width: 100%; height: 100%; object-fit: cover; }
    .idc-name { font-size: 34px; font-weight: 800; line-height: 1.15; }
    .idc-designation { font-size: 19px; color: var(--idc-brand); font-weight: 700; margin-top: 6px; }
    .idc-id { display: inline-block; margin-top: 14px; padding: 6px 14px; border-radius: 10px; background: #f0fdf4; color: var(--idc-brand-dark); font-weight: 800; font-size: 20px; letter-spacing: 0.06em; }
    .idc-id span { font-size: 12px; color: var(--idc-muted); letter-spacing: 0.2em; margin-right: 6px; }
    .idc-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; margin: 18px 0 0; }
    .idc-facts dt { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--idc-muted); }
    .idc-facts dd { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
    .idc-status-active { color: #15803d; } .idc-status-suspended, .idc-status-expired, .idc-status-inactive { color: #b45309; } .idc-status-revoked { color: #b91c1c; }
    .idc-qr { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .idc-qr img { width: 160px; height: 160px; background: #fff; padding: 8px; border-radius: 14px; border: 1px solid #e2e8f0; }
    .idc-qr span { font-size: 12px; color: var(--idc-muted); font-weight: 600; }
    .idc-back-head { padding: 28px 36px 18px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .idc-back-head .idc-org-name { color: var(--idc-brand-dark); font-size: 26px; }
    .idc-back-addr { font-size: 15px; color: var(--idc-muted); margin-top: 4px; }
    .idc-back-body { flex: 1; display: grid; grid-template-columns: 1fr 170px; gap: 30px; padding: 22px 36px; align-items: center; }
    .idc-facts-back { margin: 0; }
    .idc-legal { padding: 14px 36px 22px; font-size: 12px; line-height: 1.5; color: var(--idc-muted); border-top: 1px dashed #e2e8f0; }
    .idc-export-root { position: fixed; left: -10000px; top: 0; width: 900px; pointer-events: none; }
    .idc-export-root .idc-face { box-shadow: none; margin-bottom: 20px; }
    [dir="rtl"] .idc-band, [dir="rtl"] .idc-body, [dir="rtl"] .idc-back-body { direction: rtl; }
</style>
