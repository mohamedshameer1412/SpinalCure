<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ card.holder_name }} · {{ clinic.name|default:"SpinalCure" }}</title>
    <meta name="description" content="{{ card.designation }} at {{ clinic.name|default:'SpinalCure' }}. Verified digital ID card.">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="{{ card.holder_name }} · {{ card.designation }}">
    <meta property="og:description" content="Verified {{ card.get_card_type_display|lower }} ID card of {{ clinic.name|default:'SpinalCure' }}.">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    {% if og_image %}<meta property="og:image" content="{{ og_image }}"><meta name="twitter:image" content="{{ og_image }}">{% endif %}
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ card.holder_name }} · {{ card.designation }}">
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans Tamil', sans-serif; background: #f1f5f9; color: #0f172a; }
        main { max-width: 440px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(15,23,42,.1); }
        a { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #15803d; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <p style="color:#64748b;margin:0">{{ clinic.name|default:"SpinalCure" }}</p>
    <h1 style="margin:8px 0 4px" dir="auto">{{ card.holder_name }}</h1>
    <p style="margin:0" dir="auto">{{ card.designation }}</p>
    <a href="{{ verify_url }}">Check card status</a>
</main>
</body>
</html>
