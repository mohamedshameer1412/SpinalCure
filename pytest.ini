[pytest]
# Pytest configuration for SpinalCure project

DJANGO_SETTINGS_MODULE = spinalcure.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Show extra information during test runs
addopts = 
    --verbose
    --strict-markers
    --disable-warnings
    --tb=short
    --maxfail=3
    --reuse-db
    --nomigrations
    
# Coverage options
# addopts = --cov=. --cov-report=html --cov-report=term-missing

# Mark options
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may hit database)
    security: Security-related tests
    otp: OTP authentication tests
    slow: Slow-running tests
    django_db: Tests that use Django database
    
# Minimum Python version
minversion = 3.9

# Test discovery
testpaths = tests

# Timeout for tests (in seconds)
timeout = 300

# Raise on warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
